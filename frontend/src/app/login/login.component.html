<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <form (ngSubmit)="onLogin()">
    <input type="text" placeholder="Usuario" [(ngModel)]="username" name="username" required />
    <input type="password" placeholder="Contraseña" [(ngModel)]="password" name="password" required />
    <button type="submit">Ingresar</button>
  </form>
  <div class="demo-credentials">
    <p><strong>Credenciales de demo</strong> (solo frontend, sin backend):</p>
    <p>Usuario: <strong>user</strong> / Contraseña: <strong>5678</strong></p>
    <p>Admin: <strong>admin</strong> / Contraseña: <strong>1234</strong></p>
  </div>
</div>
